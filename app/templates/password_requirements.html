<div class="password-requirements" id="{{ requirements_id }}" role="group" aria-labelledby="{{ requirements_id }}-title">
    <p class="password-requirements-title" id="{{ requirements_id }}-title">Password requirements</p>
    <ul aria-live="polite" aria-atomic="false">
        <li data-password-check="length" data-met="false"><span class="password-check-icon" aria-hidden="true">&#9675;</span><span>12&ndash;256 characters</span><span class="password-check-state">Not yet met</span></li>
        {% for pattern, label in password_rules %}
        <li data-password-check="{{ loop.index0 }}" data-met="false"><span class="password-check-icon" aria-hidden="true">&#9675;</span><span>{{ label[0] | upper }}{{ label[1:] }}</span><span class="password-check-state">Not yet met</span></li>
        {% endfor %}
    </ul>
</div>
