<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Byte Panel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: url('{{ url_for("static", filename="bg.jpg") }}') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, {{ (config.get('bg_tint', 50) | float) / 100 }});
            backdrop-filter: blur({{ config.get('bg_blur', 5) }}px);
            -webkit-backdrop-filter: blur({{ config.get('bg_blur', 5) }}px);
            z-index: 1;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-bottom: 15vh;
            box-sizing: border-box;
            text-align: center;
        }

        .logo {
            max-width: 300px;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--text-main);
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 12px 0;
        }

        p {
            color: var(--text-main);
            font-size: 1.25rem;
            margin: 0 0 40px 0;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .btn-outline {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            padding: 14px 40px;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>

<body class="theme-{{ config.theme }}">
    <div class="content-wrapper">
        <img src="{{ url_for('static', filename='bytedev-white.png') }}" alt="ByteDev Logo" class="logo">
        <h1>Welcome to Byte Panel</h1>
        <p>A Modern Docker Solution For Hosting Minecraft Servers</p>
        <form method="POST" action="/welcome" style="margin: 0;">
            <button type="submit" class="btn-outline">Get Started</button>
        </form>
    </div>
    <div style="position: fixed; bottom: 10px; right: 10px; text-align: right; font-size: 0.8rem; color: var(--text-muted, rgba(255,255,255,0.5)); opacity: 0.7; z-index: 9999; pointer-events: none;">
        <div>{{ app_version }}</div>
        <div>bytedev.app &copy; 2026</div>
    </div>
</body>

</html>
