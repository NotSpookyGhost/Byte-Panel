<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Login - Panel Access</title>
    {% if has_custom.favicon %}
    <link rel="icon" href="/branding-assets/favicon.ico">
    {% else %}
    <link rel="icon" href="{{ url_for('static', filename='bytedev_logo.png') }}">
    {% endif %}
</head>
<body style="justify-content:center; align-items:center; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('{% if has_custom.bg %}/branding-assets/bg.jpg{% else %}{{ url_for('static', filename='bg.jpg') }}{% endif %}') no-repeat center center fixed; background-size: cover; color: var(--text-main); margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; height: 100vh;">
    <div class="card" style="width: 380px;">
        <h2>🔐 Core Authorization</h2>
        {% if error %}<p style="color:var(--accent-crimson);">{{ error }}</p>{% endif %}
        <form method="POST">
            <div style="margin-bottom:12px;">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div style="margin-bottom:20px;">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Authenticate</button>
        </form>
    </div>
</body>
</html>
