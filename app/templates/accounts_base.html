<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Accounts{% endblock %} - Byte Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='accounts.css', v=app_version) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='password_policy.css', v=app_version) }}">
    {% include 'panel_access.html' %}
    <script src="{{ url_for('static', filename='password_policy.js', v=app_version) }}" defer></script>
    <script src="{{ url_for('static', filename='accounts.js', v=app_version) }}" defer></script>
    {% include 'panel_ui.html' %}
</head>
<body class="theme-{{ config.theme }} obsidian page-accounts_base accounts-page" data-accent="{{ config.get('accent', 'lime') }}" data-restricted="{{ 'true' if current_user is defined and current_user and current_user.must_change_password else 'false' }}">
    {% set page_title = 'Account' %}
    {% include 'panel_sidebar.html' %}
{% set page_title = 'Panel Users' if request.path == '/users' else 'My Account' %}
    <main class="main-layout">{% include 'panel_header.html' %}<div class="main-content" id="panel-content" tabindex="-1">
        {% block content %}{% endblock %}
    </div></main>
</body>
</html>
